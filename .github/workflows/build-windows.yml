name: Build Windows EXE

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win --publish never

      - name: Determine version name
        id: version
        shell: bash
        run: echo "name=v$(node -p "require('./package.json').version.replace(/\.0$/, '')")" >> "$GITHUB_OUTPUT"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Circuit-Calculator-${{ steps.version.outputs.name }}
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: error
